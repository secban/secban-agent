stages:
  - lint
  - test
  - build
include:
  - component: $CI_SERVER_FQDN/components/code-quality-oss/codequality-os-scanners-integration/shellcheck@1.6.1
  - component: $CI_SERVER_FQDN/components/code-quality-oss/codequality-os-scanners-integration/golangci@1.6.1
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: "true"
shellcheck-generate:
  stage: lint
  allow_failure: false
shellcheck-format:
  stage: lint
  allow_failure: false
golangci-lint:
  stage: lint
  allow_failure: false
sast:
  stage: lint
secret_detection:
  stage: lint
go-test:
  image: golangci/golangci-lint:v2.13.2
  stage: test
  script:
    - go test -race ./...
  allow_failure: false
build:
  stage: build
  image: golangci/golangci-lint:v2.13.2
  script:
    - /bin/bash ./_scripts/build.sh 0.0.0
  allow_failure: false
